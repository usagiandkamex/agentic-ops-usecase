<!DOCTYPE html>
<!--
  システム構成図ページ（テンプレート） / Architecture diagram page (template)
  - index.html と対になるページ。reports/<分析名>/architecture.html として出力される。
  - このテンプレートを `read_file` で読み込み、BEGIN/END ARCHITECTURE_RG 区域を実トポロジで置換した完成 HTML を書き出す（HTML/CSS は自作しない・シェルコピーで作らない）。
  - ヘッダーの {{META_DATETIME}}=分析日時（**JST 明記**・例: 2026-07-27 14:30 JST）を index.html と同じ値に置換する。
    （このトークンが未置換ならレポートは無効。サンプル図の放置検知を兼ねる。）
  - 構成図は「インライン SVG」で自己完結（外部依存なし）。
  - サブスクリプション配下の全 RG を分析する場合は、RG ごとに <details class="rg"> を複製して図を分ける。
  - このテンプレートは公開ファイルのため、リソース名はサンプル。内部の SVG は作図規約の手本として使う。

  ==== 色定義（カテゴリ→色）: 本リポジトリの規約。再現性のため固定する ====
  - ネットワーク (Network)      : 青    var(--net)     #0078D4  例: VNet, App Gateway, Load Balancer, Public IP
  - コンピューティング (Compute) : ティール var(--compute) #0b8a8f 例: VM, VMSS, App Service, AKS, Functions
  - データ (Data)               : 紫    var(--data)    #8661c5  例: SQL, Storage, Cosmos DB, Key Vault
  - セキュリティ (Security)      : 赤    var(--sec)     #D13438  例: Azure Firewall, NSG, WAF, DDoS Protection
  - 監視 (Monitoring)           : 緑    var(--mon)     #107C10  例: Log Analytics, App Insights, Alerts
  - 外部 (External)             : 灰    #605e5c                 例: Internet, オンプレミス

  ==== 作図規約（グリッド） ====
  - ノード 150x60。列 X: C1=40, C2=270, C3=510, C4=750。行 Y: R1=100, R2=270, R3=390。
  - VNet はゾーン枠（.zone）、Subnet は内側の破線枠（.subnet）。VNet 内に Subnet、Subnet 内にノードを配置する。
  - 矢印は送信元/送信先ノードの辺の中心を直交（水平/垂直）で結ぶ。座標はノード座標から算出し辺に接続する。
  - 生成後にレビューし、矢印のずれ・浮き・重なり・崩れがないか確認して修正する。
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azure システム構成図</title>
<style>
  :root {
    --az-blue: #0078D4; --az-blue-dark: #243A5E;
    --az-bg: #faf9f8; --az-card: #ffffff; --az-border: #edebe9;
    --az-text: #201f1e; --az-text-sub: #605e5c;
    --net: #0078D4; --compute: #0b8a8f; --data: #8661c5; --sec: #D13438; --mon: #107C10;
    --shadow: 0 1.6px 3.6px rgba(0,0,0,.08), 0 0.3px 0.9px rgba(0,0,0,.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", "Yu Gothic UI", system-ui, sans-serif;
    background: var(--az-bg); color: var(--az-text); font-size: 14px; line-height: 1.5;
  }
  header.topbar {
    background: linear-gradient(90deg, var(--az-blue-dark), var(--az-blue));
    color: #fff; padding: 14px 28px; display: flex; align-items: center; gap: 12px;
  }
  header.topbar .logo { width: 26px; height: 26px; flex: 0 0 auto; }
  header.topbar h1 { font-size: 18px; font-weight: 600; margin: 0; }
  header.topbar .crumb { margin-left: auto; font-size: 12px; opacity: .9; }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 28px 48px; }

  .nav { margin-bottom: 20px; }
  .btn {
    display: inline-block; background: var(--az-card); color: var(--az-blue);
    border: 1px solid var(--az-border); padding: 8px 16px; border-radius: 4px;
    text-decoration: none; font-size: 13px; font-weight: 600;
  }
  .btn:hover { background: #f3f2f1; }

  .note { background: #fff4ce; border: 1px solid #f7e6a2; border-radius: 6px; padding: 10px 14px; font-size: 12px; color: #6b5300; margin-bottom: 20px; }

  /* Legend */
  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin: 0 0 20px; font-size: 12px; color: var(--az-text-sub); }
  .legend span::before {
    content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px;
    margin-right: 6px; vertical-align: middle;
  }
  .lg-net::before { background: var(--net); }
  .lg-compute::before { background: var(--compute); }
  .lg-data::before { background: var(--data); }
  .lg-sec::before { background: var(--sec); }
  .lg-mon::before { background: var(--mon); }

  /* Collapsible RG section */
  details.rg {
    background: var(--az-card); border: 1px solid var(--az-border);
    border-radius: 8px; box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden;
  }
  details.rg > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px;
    padding: 16px 24px; font-weight: 600; user-select: none;
  }
  details.rg > summary::-webkit-details-marker { display: none; }
  details.rg > summary::before {
    content: "\25B8"; color: var(--az-text-sub); transition: transform .15s ease;
  }
  details.rg[open] > summary::before { transform: rotate(90deg); }
  details.rg > summary .rg-name { font-size: 16px; }
  details.rg > summary code { background: #f3f2f1; padding: 1px 6px; border-radius: 4px; font-weight: 400; }
  .rg-body { padding: 0 24px 20px; }
  .diagram { width: 100%; overflow-x: auto; }
  svg { max-width: 100%; height: auto; display: block; }

  /* SVG helpers */
  .node rect { rx: 6; ry: 6; }
  .node text { font-family: "Segoe UI", system-ui, sans-serif; fill: #fff; font-size: 12px; font-weight: 600; }
  .node text.sub { fill: #eef; font-size: 10px; font-weight: 400; }
  .zone { fill: none; stroke: #c8c6c4; stroke-dasharray: 6 4; rx: 10; ry: 10; }
  .zone-label { fill: var(--az-text-sub); font-size: 12px; font-weight: 600; }
  .subnet { fill: rgba(0,120,212,.03); stroke: #c8c6c4; stroke-dasharray: 4 3; rx: 8; ry: 8; }
  .subnet-label { fill: var(--az-text-sub); font-size: 11px; }
  .edge { stroke: #8a8886; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
</style>
</head>
<body>

<header class="topbar">
  <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M13.6 3 6 20h4.6l1.2-3h5.1l-3.4-8.2L16 3zM7.9 21 3 21l4.2-9.4z"/></svg>
  <h1>Azure システム構成図</h1>
  <span class="crumb">分析対象のトポロジ（読み取り専用・推定）・{{META_DATETIME}}</span>
</header>

<main>

  <div class="nav"><a class="btn" href="index.html">&#8592;&nbsp;分析レポートに戻る (index.html)</a></div>

  <div class="note">本図はリソースの構成情報から推定した論理トポロジです。実際の通信経路や依存関係と異なる場合があります。リソース名は実値（ローカルレポート）に置換されます。</div>

  <div class="legend">
    <span class="lg-net">ネットワーク</span>
    <span class="lg-compute">コンピューティング</span>
    <span class="lg-data">データ</span>
    <span class="lg-sec">セキュリティ</span>
    <span class="lg-mon">監視</span>
  </div>

  <!-- ===== RG ごとに <details class="rg"> を複製 ===== -->
  <!-- BEGIN ARCHITECTURE_RG : RG ごとに下記 <details class="rg"> を雛形に複製。rg 名・要約・SVG を実トポロジに置換（グリッド/色規約を守る） -->
  <details class="rg" open>
    <summary><span class="rg-name">リソースグループ</span> <code>rg-sample-prod</code> <span style="margin-left:auto;color:var(--az-text-sub);font-weight:400">ハブ&amp;スポーク型 Web アプリ（サンプル）</span></summary>
    <div class="rg-body">
      <div class="diagram">
        <svg viewBox="0 0 940 490" role="img" aria-label="rg-sample-prod のシステム構成図">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#8a8886"/>
            </marker>
          </defs>

          <!-- VNet (zone) + Subnet (subnet) -->
          <!-- Hub VNet -->
          <rect class="zone" x="255" y="48" width="426" height="140"/>
          <text class="zone-label" x="263" y="64">Hub VNet (vnet-hub-prod · 10.0.0.0/16)</text>
          <rect class="subnet" x="262" y="76" width="166" height="100"/>
          <text class="subnet-label" x="268" y="90">GatewaySubnet (10.0.0.0/27)</text>
          <rect class="subnet" x="502" y="76" width="166" height="100"/>
          <text class="subnet-label" x="508" y="90">AzureFirewallSubnet (10.0.0.64/26)</text>
          <!-- Spoke VNet -->
          <rect class="zone" x="255" y="212" width="426" height="258"/>
          <text class="zone-label" x="263" y="228">Spoke VNet (vnet-spoke-prod · 10.1.0.0/16)</text>
          <rect class="subnet" x="262" y="240" width="166" height="218"/>
          <text class="subnet-label" x="268" y="254">snet-app (10.1.1.0/24)</text>
          <rect class="subnet" x="502" y="240" width="166" height="218"/>
          <text class="subnet-label" x="508" y="254">snet-data (10.1.2.0/24)</text>

          <!-- C1,R1 Internet (External) -->
          <g class="node">
            <rect x="40" y="100" width="150" height="60" fill="#605e5c"/>
            <text x="115" y="126" text-anchor="middle">Internet</text>
            <text class="sub" x="115" y="142" text-anchor="middle">users</text>
          </g>
          <!-- C2,R1 Application Gateway (Network) in GatewaySubnet -->
          <g class="node">
            <rect x="270" y="100" width="150" height="60" fill="var(--net)"/>
            <text x="345" y="126" text-anchor="middle">Application Gateway</text>
            <text class="sub" x="345" y="142" text-anchor="middle">agw-prod · WAF</text>
          </g>
          <!-- C3,R1 Azure Firewall (Security) in AzureFirewallSubnet -->
          <g class="node">
            <rect x="510" y="100" width="150" height="60" fill="var(--sec)"/>
            <text x="585" y="126" text-anchor="middle">Azure Firewall</text>
            <text class="sub" x="585" y="142" text-anchor="middle">afw-prod</text>
          </g>
          <!-- C4,R1 Storage / Key Vault (Data, PaaS) -->
          <g class="node">
            <rect x="750" y="100" width="150" height="60" fill="var(--data)"/>
            <text x="825" y="126" text-anchor="middle">Storage / Key Vault</text>
            <text class="sub" x="825" y="142" text-anchor="middle">stprod · kv-prod</text>
          </g>

          <!-- C2,R2 VMSS Frontend (Compute) in snet-app -->
          <g class="node">
            <rect x="270" y="270" width="150" height="60" fill="var(--compute)"/>
            <text x="345" y="296" text-anchor="middle">VMSS Frontend</text>
            <text class="sub" x="345" y="312" text-anchor="middle">vmss-frontend-prod</text>
          </g>
          <!-- C3,R2 DB VM Primary (Data) in snet-data -->
          <g class="node">
            <rect x="510" y="270" width="150" height="60" fill="var(--data)"/>
            <text x="585" y="296" text-anchor="middle">DB VM Primary</text>
            <text class="sub" x="585" y="312" text-anchor="middle">vm-db-primary-prod</text>
          </g>
          <!-- C4,R2 Log Analytics (Monitoring, PaaS) -->
          <g class="node">
            <rect x="750" y="270" width="150" height="60" fill="var(--mon)"/>
            <text x="825" y="296" text-anchor="middle">Log Analytics</text>
            <text class="sub" x="825" y="312" text-anchor="middle">law-prod</text>
          </g>

          <!-- C2,R3 VMSS Backend (Compute) in snet-app -->
          <g class="node">
            <rect x="270" y="390" width="150" height="60" fill="var(--compute)"/>
            <text x="345" y="416" text-anchor="middle">VMSS Backend</text>
            <text class="sub" x="345" y="432" text-anchor="middle">vmss-backend-prod</text>
          </g>
          <!-- C3,R3 DB VM Replica (Data) in snet-data -->
          <g class="node">
            <rect x="510" y="390" width="150" height="60" fill="var(--data)"/>
            <text x="585" y="416" text-anchor="middle">DB VM Replica</text>
            <text class="sub" x="585" y="432" text-anchor="middle">vm-db-replica-prod</text>
          </g>
          <!-- C4,R3 Alerts + Action Group (Monitoring, PaaS) -->
          <g class="node">
            <rect x="750" y="390" width="150" height="60" fill="var(--mon)"/>
            <text x="825" y="416" text-anchor="middle">Alerts + Action Group</text>
            <text class="sub" x="825" y="432" text-anchor="middle">ag-prod</text>
          </g>

          <!-- Edges: 根拠ベースの配線（直交・辺の中心同士）。推測配線は引かない -->
          <path class="edge" d="M190,130 L268,130"/>   <!-- Internet → App Gateway (ingress) -->
          <path class="edge" d="M420,130 L508,130"/>   <!-- App Gateway → Azure Firewall (egress inspection) -->
          <path class="edge" d="M345,160 L345,268"/>   <!-- App Gateway → VMSS Frontend -->
          <path class="edge" d="M345,330 L345,388"/>   <!-- VMSS Frontend → VMSS Backend -->
          <path class="edge" d="M420,300 L508,300"/>   <!-- VMSS Frontend → DB VM Primary -->
          <path class="edge" d="M585,330 L585,388"/>   <!-- DB VM Primary → DB VM Replica (replication) -->
          <path class="edge" d="M825,330 L825,388"/>   <!-- Log Analytics → Alerts + Action Group -->
        </svg>
      </div>
    </div>
  </details>
  <!-- END ARCHITECTURE_RG -->

  <!-- 全 RG 分析時: 追加 RG の <details class="rg"> をここに複製 -->

</main>
</body>
</html>
